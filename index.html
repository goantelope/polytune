<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PolyTune">
    <meta name="theme-color" content="#0d1117">
    <title>PolyTune</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="header-top">
                <h1>PolyTune</h1>
            </div>
            <div class="selectors">
                <select id="instrument-select" aria-label="Instrument"></select>
                <select id="tuning-select" aria-label="Tuning"></select>
            </div>
        </header>

        <main id="tuner-display">
            <canvas id="tuner-canvas"></canvas>
        </main>

        <footer id="footer">
            <div id="level-meter">
                <div id="level-bar"></div>
            </div>
            <button id="start-btn">Start</button>
        </footer>
    </div>

    <script src="js/tunings.js"></script>
    <script src="js/pitch-detector.js"></script>
    <script src="js/audio-engine.js"></script>
    <script src="js/tuner-core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function() {});
        }
    </script>
</body>
</html>
